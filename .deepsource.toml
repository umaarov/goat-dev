version = 1

exclude_patterns = ["tests/**", "public/**", "database/**"]
test_patterns = ["tests/**"]

[[analyzers]]
name = "php"
enabled = true

[analyzers.settings]
exclude_dirs = ["vendor", "node_modules", "public/assets/wasm"]
auto_fix = true

[[analyzers]]
name = "javascript"
enabled = true

[analyzers.settings]
exclude_dirs = ["node_modules", "public", "vendor"]
auto_fix = true

[[analyzers]]
name = "shell"
enabled = true

[analyzers.settings]
exclude_dirs = ["vendor", "node_modules", "public"]
auto_fix = true

[auto_fix]
enabled = true
exclude = ["node_modules", "vendor"]

[report]
format = "json"
send_email_notifications = true
