name: Quality Gate

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  static-analysis:
    name: Static Analysis & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer, cs2pr
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: |
          composer install --prefer-dist --no-progress --no-suggest
          npm ci

      - name: ESLint
        continue-on-error: true
        run: npm run lint

      - name: PHPStan / Psalm
        continue-on-error: true
        run: vendor/bin/psalm --output-format=github

      - name: Security Audit (Composer, production deps)
        run: composer audit --no-dev --ignore-severity=low

      - name: Security Audit (npm, production deps)
        run: npm audit --omit=dev --audit-level=high

  security:
    name: Security Scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: zricethezav/gitleaks-action@v2
        with:
          args: detect --source . -v

  tests:
    name: Tests (sqlite + MySQL)
    runs-on: ubuntu-latest
    needs: static-analysis
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: goat_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      APP_ENV: testing
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: goat_test
      DB_USERNAME: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_mysql, sqlite, pdo_sqlite, bcmath, intl, gd, exif, iconv, redis
          coverage: none

      - name: Install Deps
        run: composer install --prefer-dist --no-progress

      - name: App key
        run: echo "APP_KEY=$(php artisan key:generate --show)" >> "$GITHUB_ENV"

      - name: Fast suite (sqlite)
        run: vendor/bin/phpunit -c phpunit.sqlite.xml

      - name: Full suite (MySQL)
        run: vendor/bin/phpunit
