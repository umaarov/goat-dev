global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: [ "alertmanager:9093" ]

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [ "localhost:9090" ]

  - job_name: alertmanager
    static_configs:
      - targets: [ "alertmanager:9093" ]

  - job_name: loki
    static_configs:
      - targets: [ "loki:3100" ]

  - job_name: grafana
    static_configs:
      - targets: [ "grafana:3000" ]

  - job_name: alloy
    static_configs:
      - targets: [ "alloy:12345" ]

  - job_name: node
    static_configs:
      - targets: [ "node-exporter:9100" ]

  - job_name: cadvisor
    file_sd_configs:
      - files: [ /etc/prometheus/targets/cadvisor.yml ]

  - job_name: mysql
    static_configs:
      - targets: [ "mysqld-exporter:9104" ]

  - job_name: redis
    static_configs:
      - targets: [ "redis-exporter:9121" ]

  # Caddy/FrankenPHP: requests, latency, php threads (internal listener, not published)
  - job_name: caddy
    static_configs:
      - targets: [ "app:2020" ]

  - job_name: blackbox
    static_configs:
      - targets: [ "blackbox:9115" ]

  # is the site really answering, and for how long is its certificate valid
  - job_name: probe-http
    metrics_path: /probe
    params:
      module: [ http_2xx ]
    file_sd_configs:
      - files: [ /etc/prometheus/targets/blackbox.yml ]
    relabel_configs:
      - source_labels: [ __address__ ]
        target_label: __param_target
      - source_labels: [ __param_target ]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
