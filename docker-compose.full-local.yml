name: goat-local

x-app: &app
  image: goat-app:local
  pull_policy: never
  env_file:
    - .env
  restart: unless-stopped
  volumes:
    - ./docker/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    - goat-storage:/app/storage/app/public
    - ./storage/logs:/app/storage/logs
  networks:
    - goat-network
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  app:
    <<: *app
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_PUSHER_APP_KEY: ${PUSHER_APP_KEY}
        VITE_PUSHER_APP_CLUSTER: ${PUSHER_APP_CLUSTER}
    pull_policy: build
    entrypoint:
      - /bin/sh
      - -c
      - 'php artisan storage:link || true; php artisan optimize:clear; exec "$$@"'
      - entrypoint
    command: frankenphp run --config /etc/caddy/Caddyfile
    ports:
      - "8000:80"
    volumes:
      - ./docker/Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - ./docker/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
      - goat-storage:/app/storage/app/public
      - ./storage/logs:/app/storage/logs
      - caddy_data:/data
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://127.0.0.1/up || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    <<: *app
    command: php artisan queue:work --tries=3 --timeout=90
    healthcheck:
      test: [ "CMD-SHELL", "pgrep -f 'queue:work' || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  scheduler:
    <<: *app
    command: php artisan schedule:work
    healthcheck:
      test: [ "CMD-SHELL", "pgrep -f 'schedule:work' || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  db:
    image: mysql:8.0
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD}"
      MYSQL_DATABASE: "${DB_DATABASE}"
      MYSQL_USER: "${DB_USERNAME}"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - goat-db-data:/var/lib/mysql
    networks:
      - goat-network
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent" ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    restart: unless-stopped
    volumes:
      - goat-redis-data:/data
    networks:
      - goat-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 20

  goat-search:
    build:
      context: ./goat-search
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:9999:9999"
    volumes:
      - ./dashboard:/app
    networks:
      - goat-network

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
    networks:
      - goat-network

  adminer:
    image: adminer
    profiles: [ "tools" ]
    environment:
      ADMINER_DEFAULT_SERVER: db
      ADMINER_DESIGN: "pepa-lined"
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - goat-network

networks:
  goat-network:
    driver: bridge

volumes:
  caddy_data:
  goat-db-data:
  goat-redis-data:
  goat-storage:
