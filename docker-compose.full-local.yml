# docker compose -f docker-compose.full-local.yml up -d
# app :8000, mailpit :8025, adminer (--profile tools) :8080
name: goat-local

x-app: &app
  image: goat-app:local
  pull_policy: never
  env_file:
    - .env
  environment:
    NODE_AUTH_TOKEN: ""
    GITHUB_API_TOKEN: ""
    XDG_DATA_HOME: /tmp/caddy-data
    XDG_CONFIG_HOME: /tmp/caddy-config
  # no root, no caps, no writes outside tmpfs/volumes
  user: "10001:10001"
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp
    - /app/bootstrap/cache
    - /app/storage/framework/views
    - /app/storage/framework/cache
    - /app/storage/framework/sessions
  # posting-only hosts, so tokens in .env can never publish from here
  extra_hosts:
    - "api.telegram.org:0.0.0.0"
    - "graph.facebook.com:0.0.0.0"
    - "upload.twitter.com:0.0.0.0"
    - "upload.x.com:0.0.0.0"
  restart: unless-stopped
  volumes:
    - ./docker/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    - goat-storage:/app/storage/app/public
    - ./storage/logs:/app/storage/logs
    - goat-metrics:/app/storage/metrics
    - goat-backup-tmp:/app/storage/backup-tmp
  networks:
    - goat-network
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
    metrics-init:
      condition: service_completed_successfully

services:
  app:
    <<: *app
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_PUSHER_APP_KEY: ${PUSHER_APP_KEY}
        VITE_PUSHER_APP_CLUSTER: ${PUSHER_APP_CLUSTER}
    pull_policy: build
    # skip npm build of default entrypoint
    entrypoint:
      - /bin/sh
      - -c
      - 'php artisan storage:link || true; php artisan optimize:clear; exec "$$@"'
      - entrypoint
    command: frankenphp run --config /etc/caddy/Caddyfile
    # the frankenphp binary carries this file capability
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - "8000:80"
    volumes:
      - ./docker/Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - ./docker/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
      - goat-storage:/app/storage/app/public
      - ./storage/logs:/app/storage/logs
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://127.0.0.1/up || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # named volumes start root-owned; the app runs as 10001
  metrics-init:
    image: goat-app:local
    pull_policy: never
    user: "0:0"
    entrypoint: [ "/bin/sh", "-c", "chown 10001:10001 /m /b && chmod 755 /m && chmod 700 /b" ]
    volumes:
      - goat-metrics:/m
      - goat-backup-tmp:/b
    restart: "no"

  worker:
    <<: *app
    command: php artisan queue:work --queue=default,scoring --tries=3 --timeout=90
    healthcheck:
      test: [ "CMD-SHELL", "pgrep -f 'queue:work' || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  scheduler:
    <<: *app
    command: php artisan schedule:work
    healthcheck:
      test: [ "CMD-SHELL", "pgrep -f 'schedule:work' || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  db:
    image: mysql:8.0
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD}"
      MYSQL_DATABASE: "${DB_DATABASE}"
      MYSQL_USER: "${DB_USERNAME}"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - goat-db-data:/var/lib/mysql
    networks:
      - goat-network
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent" ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD:?set REDIS_PASSWORD}"
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
    volumes:
      - goat-redis-data:/data
    networks:
      - goat-network
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG" ]
      interval: 5s
      timeout: 3s
      retries: 20

  goat-search:
    build:
      context: ./goat-search
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:9999:9999"
    volumes:
      - ./dashboard:/app
    networks:
      - goat-network

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
    networks:
      - goat-network

  # never uses .env: no tokens, no goat_app DB
  test:
    image: goat-app:local
    pull_policy: never
    profiles: [ "tools" ]
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - composer install --no-interaction --prefer-dist -q && vendor/bin/phpunit -c phpunit.sqlite.xml && vendor/bin/phpunit
    environment:
      APP_ENV: testing
      APP_KEY: ${APP_KEY}
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: goat_test
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - goat-vendor-dev:/app/vendor
    networks:
      - goat-network
    depends_on:
      db:
        condition: service_healthy

  adminer:
    image: adminer
    profiles: [ "tools" ]
    environment:
      ADMINER_DEFAULT_SERVER: db
      ADMINER_DESIGN: "pepa-lined"
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - goat-network

networks:
  goat-network:
    driver: bridge

volumes:
  goat-db-data:
  goat-redis-data:
  goat-storage:
  goat-metrics:
  goat-backup-tmp:
  goat-vendor-dev:
